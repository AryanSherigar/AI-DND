[project]
name = "turn-resolution-service"
version = "0.1.0"
description = "Turn Resolution Service for AI-DND"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "google-genai>=1.75.0,<3.0.0",
    "tenacity>=9.0.0,<10.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
