name: ai-dnd

services:
  postgres:
    image: postgres:16-alpine
    container_name: aidnd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidnd_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aidnd_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  migration-runner:
    build:
      context: ./apps/core-api
      dockerfile: Dockerfile
    container_name: aidnd-migration-runner
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${CORE_API_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/aidnd_db}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

  core-api:
    build:
      context: ./apps/core-api
      dockerfile: Dockerfile
    container_name: aidnd-core-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${CORE_API_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/aidnd_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-ai-dnd-47eb0}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000","http://localhost:80"]}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
      MEMORY_SERVICE_URL: http://memory-layer:8002
      MEMORY_SERVICE_API_KEY: ${MEMORY_SERVICE_API_KEY:-dev-memory-layer-key-change-in-production}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    networks:
      - frontend-net
      - backend-net

  turn-resolution-service:
    build:
      context: ./apps/turn-resolution-service
      dockerfile: Dockerfile
    container_name: aidnd-trs
    restart: unless-stopped
    environment:
      DATABASE_URL: ${TRS_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/aidnd_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000","http://localhost:80"]}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEMORY_SERVICE_URL: http://memory-layer:8002
      MEMORY_SERVICE_API_KEY: ${MEMORY_SERVICE_API_KEY:-dev-memory-layer-key-change-in-production}
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  postgres-memory:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: aidnd-postgres-memory
    restart: unless-stopped
    environment:
      POSTGRES_USER: context_memory
      POSTGRES_PASSWORD: context_memory
      POSTGRES_DB: context_memory
    volumes:
      - postgres_memory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_memory -d context_memory"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  hydradb:
    image: ghcr.io/hydra-db/hydradb:${HYDRADB_IMAGE_TAG:-sha-02a4002}
    container_name: aidnd-hydradb
    restart: unless-stopped
    entrypoint: ["sh", "-c", "mkdir -p /tmp/graph /var/cache/slatedb && echo '${HYDRADB_API_KEY:-context-memory-local-smoke-token-32b}' > /tmp/graph/auth-token && exec graph-node"]
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /tmp/graph
      GRAPH_NAMESPACE: default
      GRAPH_ID: ${HYDRADB_GRAPH_ID:-default}
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /var/cache/slatedb
      GRAPH_AUTH_TOKEN_FILE: /tmp/graph/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
    volumes:
      - hydradb_store:/tmp/graph
      - hydradb_cache:/var/cache/slatedb
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - backend-net

  memory-layer-migration-runner:
    build:
      context: ./apps/memory-layer
      dockerfile: Dockerfile
    container_name: aidnd-memory-layer-migration-runner
    command: ["python", "scripts/run_migrations.py"]
    environment:
      CONTEXT_MEMORY_DATABASE_URL: ${MEMORY_LAYER_DATABASE_URL:-postgresql://context_memory:context_memory@postgres-memory:5432/context_memory}
    restart: "no"
    depends_on:
      postgres-memory:
        condition: service_healthy
    networks:
      - backend-net

  memory-layer:
    build:
      context: ./apps/memory-layer
      dockerfile: Dockerfile
    container_name: aidnd-memory-layer
    restart: unless-stopped
    environment:
      CONTEXT_MEMORY_DATABASE_URL: ${MEMORY_LAYER_DATABASE_URL:-postgresql://context_memory:context_memory@postgres-memory:5432/context_memory}
      CONTEXT_MEMORY_HYDRADB_URL: http://hydradb:8443
      CONTEXT_MEMORY_HYDRADB_TOKEN: ${HYDRADB_API_KEY:-context-memory-local-smoke-token-32b}
      CONTEXT_MEMORY_HYDRADB_DATABASE: ${HYDRADB_GRAPH_ID:-default}
      CONTEXT_MEMORY_API_KEY: ${MEMORY_LAYER_API_KEY:-dev-memory-layer-key-change-in-production}
      CONTEXT_MEMORY_ALLOWED_ORIGINS: ${CORS_ORIGINS:-}
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8002"
    depends_on:
      postgres-memory:
        condition: service_healthy
      hydradb:
        condition: service_healthy
      memory-layer-migration-runner:
        condition: service_completed_successfully
    networks:
      - backend-net

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_CORE_API_URL: ${VITE_CORE_API_URL:-/api}
        VITE_TRS_URL: ${VITE_TRS_URL:-/trs}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_MEASUREMENT_ID: ${VITE_MEASUREMENT_ID:-}
    container_name: aidnd-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - core-api
      - turn-resolution-service
    networks:
      - frontend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  postgres_data:
  postgres_memory_data:
  hydradb_store:
  hydradb_cache:
